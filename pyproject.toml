[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-asset-api-mcp-base"
version = "0.1.0"
description = "MCP base component for scanning Git repositories and packaging code assets into HTTP APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=2.0.0,<3",
    "pydantic>=2.11,<3",
    "pyyaml>=6",
    "fastapi>=0.141,<1",
    "uvicorn>=0.52,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
git-asset-mcp = "git_asset_mcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
