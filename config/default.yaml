# git-asset-api-mcp-base 默认配置
# 环境变量优先于本文件；敏感信息只从环境变量读取。

data_dir: ./data
generated_dir: ./generated
log_dir: ./logs

# 仓库访问（Token 从 GITHUB_TOKEN 环境变量读取，不写在这里）
allowed_hosts:
  - github.com

# 可选 LLM 语义增强（默认关闭，关闭后走确定性流程）
llm:
  enabled: false
  base_url: ""
  model: ""
  timeout: 60

# 安全上限
max_file_bytes: 2097152
max_repo_bytes: 209715200

# RAG 语义检索（可选；模型未就绪自动降级，不影响其余功能）
# 环境变量优先：RAG_EMBED_MODEL（模型名/路径）、RAG_MODELS_DIR（模型目录）
rag:
  embed_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  models_dir: ""   # 空 = 默认 ~/.git-asset/models
